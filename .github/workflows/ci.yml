name: CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - 'my-docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'rustfmt.toml'
      - '.clippy.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'main.py'
      - 'index.js'
      - 'bun.ts'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - 'my-docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'rustfmt.toml'
      - '.clippy.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'main.py'
      - 'index.js'
      - 'bun.ts'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Code Quality & Clippy Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings
