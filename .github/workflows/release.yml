name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
    paths-ignore:
      - 'docs/**'
      - 'my-docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'rustfmt.toml'
      - '.clippy.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'main.py'
      - 'index.js'
      - 'bun.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_bin: target/x86_64-unknown-linux-gnu/release/dvp
            artifact_lib: target/x86_64-unknown-linux-gnu/release/libdvp.so
            asset_bin: dvp-linux-x86_64
            asset_lib: libdvp-linux-x86_64.so

          # Linux ARM64 (Android Termux / Raspberry Pi / AWS Graviton)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_bin: target/aarch64-unknown-linux-gnu/release/dvp
            artifact_lib: target/aarch64-unknown-linux-gnu/release/libdvp.so
            asset_bin: dvp-linux-aarch64
            asset_lib: libdvp-linux-aarch64.so
            use_cross_linker: true

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_bin: target/x86_64-pc-windows-msvc/release/dvp.exe
            artifact_lib: target/x86_64-pc-windows-msvc/release/dvp.dll
            asset_bin: dvp-windows-x86_64.exe
            asset_lib: dvp-windows-x86_64.dll

          # macOS Apple Silicon (M1/M2/M3/M4 ARM64)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_bin: target/aarch64-apple-darwin/release/dvp
            artifact_lib: target/aarch64-apple-darwin/release/libdvp.dylib
            asset_bin: dvp-macos-aarch64
            asset_lib: libdvp-macos-aarch64.dylib

          # macOS Intel (x86_64)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_bin: target/x86_64-apple-darwin/release/dvp
            artifact_lib: target/x86_64-apple-darwin/release/libdvp.dylib
            asset_bin: dvp-macos-x86_64
            asset_lib: libdvp-macos-x86_64.dylib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM64 Cross Linker (Linux ARM64)
        if: matrix.use_cross_linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          cp ${{ matrix.artifact_bin }} ./${{ matrix.asset_bin }}
          cp ${{ matrix.artifact_lib }} ./${{ matrix.asset_lib }}

      - name: Prepare Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item ${{ matrix.artifact_bin }} ./${{ matrix.asset_bin }}
          Copy-Item ${{ matrix.artifact_lib }} ./${{ matrix.asset_lib }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: |
            ${{ matrix.asset_bin }}
            ${{ matrix.asset_lib }}

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d '"' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Cargo.toml Version: $VERSION"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten Artifact Directory
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release v${{ steps.get_version.outputs.version }}"
          tag_name: "v${{ steps.get_version.outputs.version }}"
          files: dist/*
          generate_release_notes: true
